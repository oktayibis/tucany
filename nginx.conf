server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Include default Nginx MIME types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Gzip compression for fast loading over mobile networks
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/manifest+json image/svg+xml;
    gzip_min_length 1000;

    # SPA routing fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Custom mime type for PWA webmanifest
    location ~ \.webmanifest$ {
        default_type application/manifest+json;
        add_header Content-Type application/manifest+json;
    }

    # Prevent aggressive caching of service worker so updates are detected immediately
    location ~* (sw\.js|registerSW\.js)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Expires "0";
        try_files $uri =404;
    }

    # Cache static assets (JS, CSS, images) aggressively
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
